name: build-ipa13

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解压源码
        run: |
          rm -rf src && mkdir -p src
          unzip -q source.zip -d src
          find src -maxdepth 3 | sort | head -40

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: src
        run: xcodegen generate

      - name: 编译（不签名）
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild \
            -project BanBao.xcodeproj \
            -scheme BanBao \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: 打包未签名 IPA
        run: |
          mkdir -p Payload
          cp -R src/build/Build/Products/Release-iphoneos/BanBao.app Payload/
          zip -qry BanBao-unsigned.ipa Payload
          ls -lh BanBao-unsigned.ipa
          unzip -l BanBao-unsigned.ipa | tail -15

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: BanBao-unsigned-ipa
          path: BanBao-unsigned.ipa
          retention-days: 30

      - name: 回传构建结果
        if: always()
        run: |
          mkdir -p dist
          rm -f dist/BanBao-unsigned.ipa dist/build.log
          if [ -f BanBao-unsigned.ipa ]; then
            cp BanBao-unsigned.ipa dist/BanBao-unsigned.ipa
            echo BUILD_OK > dist/status.txt
          else
            echo BUILD_FAILED > dist/status.txt
          fi
          if [ -f build.log ]; then
            grep -E "error:|BUILD (SUCCEEDED|FAILED)|The following build commands failed" build.log | head -150 > dist/build.log || true
          fi
          git config user.name ipa-builder
          git config user.email ipa-builder@users.noreply.github.com
          git add -f dist
          git commit -m "ci: build result [skip ci]" || echo nothing-to-commit
          git push origin HEAD:main || echo push-failed
